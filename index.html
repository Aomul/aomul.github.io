<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 引入小来字体 -->
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/gh/FrecklyComb1728/blog@main/public/fonts/xiaolai.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 淡淡的蓝色背景 */
            background-color: #d0e5f7;
            color: #333333;
        }
        h1 {
            font-family: xiaolai, sans-serif;
            font-size: 2.4rem;
            margin-bottom: 2rem;
            font-weight: normal;
            text-align: center;
        }
        .tip-text {
            font-family: xiaolai, sans-serif;
            font-size: 1.6rem;
            text-align: center;
            max-width: 85vw;
            margin-bottom: 2.5rem;
        }
        /* 长条形播放器容器 */
        .audio-player {
            width: 80vw;
            max-width: 480px;
            padding: 16px 22px;
            background: #ffffff;
            border-radius: 999px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-family: xiaolai, sans-serif;
        }
        .player-top {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .play-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #42b983;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            /* 简约高级优化：过渡动画 + hover效果 */
            transition: all 0.2s ease;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .play-btn:hover {
            background: #38a474;
            transform: scale(1.05);
        }
        .play-btn:active {
            transform: scale(0.96);
        }
        .info-group {
            display: flex;
            flex-direction: column;
        }
        .song-name {
            font-size: 1.1rem;
            color: #333;
        }
        .author-name {
            font-size: 0.9rem;
            color: #666;
        }
        /* 美化简约进度条 */
        .progress-wrap {
            width: 100%;
        }
        #progressBar {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #e5e7eb;
            border-radius: 99px;
            outline: none;
            cursor: pointer;
        }
        #progressBar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #42b983;
            border: none;
        }
        #progressBar::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #42b983;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Setutime公告</h1>
    <div class="tip-text">站长养病中，过段时间再来访问吧。</div>

    <!-- 播放器 -->
    <div class="audio-player">
        <div class="player-top">
            <button class="play-btn" id="playBtn">▶</button>
            <div class="info-group">
                <div class="song-name">Small Happiness</div>
                <div class="author-name">麗美 (れいみぃ)</div>
            </div>
        </div>
        <div class="progress-wrap">
            <input type="range" id="progressBar" value="0" min="0" max="100">
        </div>
    </div>
    <audio id="audio" src="https://r2.setutime.top/V/music.mp4">

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        let isPlaying = false;

        // 播放暂停
        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play();
                playBtn.textContent = '⏸';
            } else {
                audio.pause();
                playBtn.textContent = '▶';
            }
            isPlaying = !isPlaying;
        });

        // 更新进度条
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.value = percent || 0;
        });

        // 拖动进度条跳转
        progressBar.addEventListener('input', () => {
            const seekTime = (progressBar.value / 100) * audio.duration;
            audio.currentTime = seekTime;
        });

        // 播放结束重置
        audio.addEventListener('ended', () => {
            playBtn.textContent = '▶';
            progressBar.value = 0;
            isPlaying = false;
        })
    </script>
</body>
</html>
